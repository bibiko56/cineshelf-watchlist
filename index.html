<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineShelf — Sign In or Register</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-container">
    <div class="auth-brand">
      <span class="brand-badge">CINESHELF</span>
      <h1>Your Personal Cinema & Series Tracker</h1>
      <p>Track movies, binge progress, streaming platforms, ratings, and spoiler-free notes—all stored privately in your browser.</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Sign In</button>
        <button class="tab-btn" data-tab="register">Create Account</button>
      </div>

      <div id="auth-message" class="alert hidden"></div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="text" id="login-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign In</button>

        <div class="demo-box">
          <span>Quick Demo Access:</span>
          <div style="display: flex; gap: 0.4rem;">
            <button type="button" id="demo-login-btn" class="btn btn-ghost btn-sm">
              User Demo
            </button>
            <button type="button" id="admin-login-btn" class="btn btn-ghost btn-sm">
              Admin Demo
            </button>
          </div>
        </div>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label for="reg-name">Display Name</label>
          <input type="text" id="reg-name" placeholder="Alex Rivera" required />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="reg-password">Password (min. 4 chars)</label>
          <input type="password" id="reg-password" minlength="4" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Create Account</button>
      </form>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
